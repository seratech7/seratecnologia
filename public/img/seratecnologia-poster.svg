    <path d="M120 0 V1080 M960 0 V1080"/>
  </g>
  <g fill="#22D3EE" fill-opacity="0.18">
    <circle cx="120" cy="150" r="4"/><circle cx="960" cy="150" r="4"/>
    <circle cx="120" cy="930" r="4"/><circle cx="960" cy="930" r="4"/>
  </g>

  
  <g transform="translate(412,210) scale(4)">
    <rect x="6" y="6" width="52" height="52" rx="15" fill="url(#g)"/>
    <rect x="6" y="6" width="52" height="52" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
    <g fill="#ffffff" fill-opacity="0.9">
      <rect x="20" y="57" width="4" height="7" rx="1.5"/>
      <rect x="30" y="57" width="4" height="7" rx="1.5"/>
      <rect x="40" y="57" width="4" height="7" rx="1.5"/>
    </g>
    <g fill="#ffffff" fill-opacity="0.85">
      <circle cx="15" cy="15" r="2.6"/>
      <circle cx="49" cy="15" r="2.6"/>
      <circle cx="15" cy="49" r="2.6"/>
      <circle cx="49" cy="49" r="2.6"/>
    </g>
    <text x="32" y="33" text-anchor="middle" dominant-baseline="central"
