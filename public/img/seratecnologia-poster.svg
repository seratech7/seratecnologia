    <tspan fill="#ffffff">Sera</tspan><tspan fill="url(#g2)">Tecnologia</tspan>
  </text>

  <line x1="360" y1="650" x2="720" y2="650" stroke="url(#g2)" stroke-width="3" stroke-linecap="round"/>

  <text x="540" y="712" text-anchor="middle"
